<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zamo Survival | Fuga del Laboratorio</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1024 height=576 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <button id="mobile-fullscreen-button" type="button" aria-label="Activar pantalla completa">⛶</button>
      <div id="mobile-rotate-hint">Gira tu celular horizontalmente para jugar</div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Zamo Survival | Fuga del Laboratorio</div>
      </div>
    </div>
    <script src="audio-manager.js"></script>
    <script src="game.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fullscreenBtn = document.querySelector("#unity-fullscreen-button");
      if (fullscreenBtn) {
        fullscreenBtn.onclick = () => {
          if (canvas.requestFullscreen) {
            canvas.requestFullscreen();
          } else if (canvas.webkitRequestFullscreen) {
            canvas.webkitRequestFullscreen();
          }
        };
      }
      var mobileFullscreenBtn = document.querySelector("#mobile-fullscreen-button");
      if (mobileFullscreenBtn) {
        mobileFullscreenBtn.onclick = () => {
          const container = document.querySelector("#unity-container");
          const requestFullscreen = container.requestFullscreen || container.webkitRequestFullscreen;
          if (requestFullscreen) requestFullscreen.call(container);
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        };
      }
    </script>
  </body>
</html>
